name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android_app/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: ⚙️ Make Gradlew Executable
        run: chmod +x android_app/gradlew

      - name: 🔨 Build Debug APK
        run: |
          cd android_app
          ./gradlew assembleDebug --stacktrace

      - name: 📦 Prepare Output Artifact
        run: |
          mkdir -p apk_output
          cp android_app/app/build/outputs/apk/debug/app-debug.apk apk_output/Sisters_Live_Academy.apk
          ls -lh apk_output/Sisters_Live_Academy.apk

      - name: 🚀 Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sisters_Live_Academy_APK
          path: apk_output/Sisters_Live_Academy.apk
          retention-days: 30
